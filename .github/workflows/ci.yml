name: CI - Integración Continua y Testing Automatizado

on:
  push:
    branches:
      - main
      - 'est**'
      - 'Est**'
  pull_request:
    branches:
      - main

jobs:
  test-and-quality:
    name: Pruebas Automatizadas con Selenium y Calidad Continua
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Google Chrome y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          google-chrome --version || true

      - name: Instalar dependencias de Node.js
        run: |
          npm ci || npm install

      - name: Ejecutar Suite de Pruebas Automatizadas (Selenium)
        run: |
          npm test

      - name: Guardar evidencias de prueba como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pruebas
          path: evidencias/
          if-no-files-found: ignore
